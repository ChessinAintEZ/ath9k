- name: Configure and Build Kernel Modules
        run: |
          cd android-kernel
          
          # 1. Base Android GKI Configuration
          make ARCH=arm64 LLVM=1 gki_defconfig

          # 2. Disable in-kernel headers generation
          scripts/config --disable CONFIG_IKHEADERS
          scripts/config --disable CONFIG_IKHEADERS_PROC

          # 3. Enable Core Networking, Crypto, and Subsystem Flags
          scripts/config --enable CONFIG_NET
          scripts/config --enable CONFIG_WIRELESS
          scripts/config --enable CONFIG_NETDEVICES
          scripts/config --enable CONFIG_WLAN
          scripts/config --enable CONFIG_CRYPTO
          scripts/config --enable CONFIG_CRYPTO_LIB_ARC4

          scripts/config --module CONFIG_CFG80211
          scripts/config --module CONFIG_MAC80211
          scripts/config --enable CONFIG_MAC80211_HAS_RC
          scripts/config --enable CONFIG_MAC80211_RC_MINSTREL

          scripts/config --enable CONFIG_WLAN_VENDOR_ATH
          scripts/config --module CONFIG_ATH_COMMON
          scripts/config --module CONFIG_ATH9K_HW
          scripts/config --module CONFIG_ATH9K_COMMON
          scripts/config --module CONFIG_ATH9K_HTC

          # 4. Resolve dependencies
          make ARCH=arm64 LLVM=1 olddefconfig

          # 5. Prepare build environment
          make ARCH=arm64 LLVM=1 modules_prepare

          # 6. Build ALL enabled modules in a single pass (resolves Module.symvers)
          make ARCH=arm64 LLVM=1 -j$(nproc) modules
