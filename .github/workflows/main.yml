name: Build ath9k_htc LKM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev bison flex

      - name: Build Kernel Modules
        run: |
          # Executes your original repo build process
          make -j$(nproc) || true

      - name: Stage Artifacts
        run: |
          mkdir -p artifact

          # 1. Grab base Atheros module (contains ath_printk, cycle counters, etc.)
          find . -name "ath.ko" -exec cp {} artifact/ \; 2>/dev/null || true
          
          # 2. Grab ath9k modules
          find . -name "ath9k_hw.ko" -exec cp {} artifact/ \; 2>/dev/null || true
          find . -name "ath9k_common.ko" -exec cp {} artifact/ \; 2>/dev/null || true
          find . -name "ath9k_htc.ko" -exec cp {} artifact/ \; 2>/dev/null || true

          # 3. Grab wireless stack dependencies
          find . -name "mac80211.ko" -exec cp {} artifact/ \; 2>/dev/null || true
          find . -name "cfg80211.ko" -exec cp {} artifact/ \; 2>/dev/null || true

          # Print staged files to check output before upload
          echo "=== Staged Artifacts ==="
          ls -la artifact/

      - name: Upload Kernel Modules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ath9k-kernel-modules
          path: artifact/
