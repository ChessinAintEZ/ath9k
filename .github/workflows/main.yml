name: Build ath9k_htc LKM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev bison flex

      - name: Download Kernel Source and Build Modules
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/projects/backports/stable/v6.1/backports-6.1-1.tar.xz || true
          if [ -f backports-6.1-1.tar.xz ]; then
            tar -xf backports-6.1-1.tar.xz
            cd backports-6.1-1
            ./gentree.py --defconfig-ath9k /tmp/ath9k-out
            cd /tmp/ath9k-out
            make -j$(nproc)
          fi

      - name: Stage Artifacts
        run: |
          mkdir -p artifact
          
          # Search current workspace AND /tmp for all compiled kernel modules
          sudo find /tmp $GITHUB_WORKSPACE -name "*.ko" -exec cp {} artifact/ \; 2>/dev/null || true

          echo "=== Staged Artifacts ==="
          ls -la artifact/

      - name: Upload Kernel Modules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ath9k-kernel-modules
          path: artifact/
          if-no-files-found: error
