name: Build ath9k_htc LKM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev bison flex

      - name: Build Kernel Modules
        run: |
          # Adjust make commands here if your repository uses specific CROSS_COMPILE or ARCH flags
          # If your Makefile is inside a subfolder, cd there first
          cd path/to/your/module/folder
          make -j$(nproc)

      - name: Stage Artifacts (Fix Missing Base Modules)
        run: |
          mkdir -p artifact
          
          # Copy base Atheros module (contains ath_printk, ath_hw cycle counters, etc.)
          cp drivers/net/wireless/ath/ath.ko artifact/ 2>/dev/null || true
          
          # Copy hardware, common, and HTC modules
          cp drivers/net/wireless/ath/ath9k/*.ko artifact/ 2>/dev/null || true
          
          # Copy wireless stack modules
          cp net/mac80211/mac80211.ko artifact/ 2>/dev/null || true
          cp net/wireless/cfg80211.ko artifact/ 2>/dev/null || true

          # Output staged files to action log
          echo "=== Staged Artifacts ==="
          cp drivers/net/wireless/ath/ath.ko artifact/ 2>/dev/null || true
          ls -la artifact/

      - name: Upload Kernel Modules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ath9k-kernel-modules
          path: artifact/
